# test profili: Testcontainers PostgreSQL (TestcontainersConfiguration).
# Bağlantı bilgisi konteynerden gelir (@ServiceConnection) ve DB_URL gibi ayarların
# önüne geçer; testler Supabase'e bağlanmaz.
logging:
  level:
    root: WARN
    com.dogus.vacation: INFO

# Testlere özel, gerçek olmayan JWT anahtarı (en az 32 bayt). Gerçek anahtar .env'de durur.
app:
  security:
    jwt:
      secret: test-only-jwt-signing-key-not-used-in-any-environment
      expiration-minutes: 60
