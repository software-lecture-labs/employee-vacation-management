# dev profili: ortak Supabase veritabanı, SQL ve transaction logları açık.
# Çalıştırma: --spring.profiles.active=dev  (IntelliJ: Run Configuration > Active profiles)
logging:
  level:
    com.dogus.vacation: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.transaction: DEBUG
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
